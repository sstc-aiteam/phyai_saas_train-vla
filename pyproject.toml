[project]
name = "lerobot-training-service"
version = "0.1.0"
description = "LeRobot training service backend API and GPU worker"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic[email]>=2.9",
    "pydantic-settings>=2.5",
    "bcrypt>=4.2",
    "pyjwt>=2.9",
    "httpx>=0.27",
    "google-cloud-firestore>=2.19",
    "google-cloud-storage>=2.18",
    "docker>=7.1",
    "huggingface-hub>=0.25",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-mock>=3.14",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/common", "src/backend", "src/worker"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
asyncio_mode = "auto"
